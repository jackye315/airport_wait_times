name: airport-wait-times

x-backend: &backend
  build:
    context: ./backend
  user: "${APP_UID:-1000}:${APP_GID:-1000}"
  env_file: .env
  environment:
    APP_ENV: production
    DATABASE_URL: sqlite:////data/airports.db
    MODEL_ARTIFACT_DIR: /artifacts
    BACKUP_DIR: /backups
    CORS_ORIGINS: https://${DOMAIN}
    PUBLIC_BASE_URL: https://${DOMAIN}
  volumes:
    - ./data:/data
    - ./artifacts:/artifacts
    - ./backups:/backups
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true

services:
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  backend:
    <<: *backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2", "--proxy-headers", "--forwarded-allow-ips=*"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks:
      default:
      openjack_edge:
        aliases:
          - airport-backend

  scheduler:
    <<: *backend
    command: ["python", "-m", "app.jobs.scheduler"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      target: production
      args:
        NEXT_PUBLIC_API_URL: ""
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/dashboard"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks:
      default:
      openjack_edge:
        aliases:
          - airport-frontend

networks:
  openjack_edge:
    name: openjack-edge
    external: true
