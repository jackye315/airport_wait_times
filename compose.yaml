name: airport-wait-times-dev

x-backend: &backend
  build:
    context: ./backend
  user: "${APP_UID:-1000}:${APP_GID:-1000}"
  env_file: .env
  environment:
    APP_ENV: development
    DATABASE_URL: sqlite:////data/airports.db
    MODEL_ARTIFACT_DIR: /artifacts
    BACKUP_DIR: /backups
  volumes:
    - ./backend/app:/app/app
    - ./backend/migrations:/app/migrations
    - ./data:/data
    - ./artifacts:/artifacts
    - ./backups:/backups

services:
  backend-test:
    build:
      context: ./backend
      target: test
    environment:
      DATABASE_URL: "sqlite:///:memory:"
      PYTHONPATH: /app
    user: root
    volumes:
      - ./backend:/app
    profiles: ["tests"]

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  backend:
    <<: *backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  scheduler:
    <<: *backend
    command: ["python", "-m", "app.jobs.scheduler"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  frontend_node_modules:
