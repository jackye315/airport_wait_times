[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "airport-wait-times-backend"
version = "0.1.0"
description = "JFK and LGA security wait-time collection, analytics, and prediction API"
requires-python = ">=3.10"
dependencies = [
  "alembic>=1.13,<2",
  "apscheduler>=3.10,<4",
  "fastapi>=0.115,<1",
  "holidays>=0.58,<1",
  "httpx>=0.27,<1",
  "joblib>=1.4,<2",
  "lzstring>=1.0.4,<2",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pydantic-settings>=2.6,<3",
  "python-dateutil>=2.9,<3",
  "scikit-learn>=1.5,<2",
  "sqlalchemy>=2.0,<3",
  "tenacity>=9,<10",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
